[project]
name = "voice-slide-presenter"
version = "0.1.0"
description = "Voice-first AI slide presenter backend (FastAPI + OpenAI Agents SDK realtime)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "openai-agents>=0.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "rapidfuzz>=3.10",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
